name: Test with packages input (non-Windows OS check)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          install-dir: C:\tools\cygwin
          packages: curl wget git

      - name: Assert action fails gracefully on non-Windows with packages input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on non-Windows OS even with packages specified"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed on Linux"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
