name: Test Cygwin installation with hardlinks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-dir: C:\tools\cygwin
          hardlinks: '1'
      - name: Assert Cygwin is installed
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\tools\cygwin\bin\bash.exe')) {
            Write-Host "FAIL: bash.exe not found in install dir"
            exit 1
          }
          Write-Host "PASS: Cygwin installed successfully"
      - name: Assert no symlinks remain in bin (hardlinks converted)
        shell: C:\tools\cygwin\bin\bash.exe --login -o errexit -o nounset -o pipefail {0}
        run: |
          symlink_count=$(find /usr/bin -type l | wc -l)
          echo "Symlink count in /usr/bin: $symlink_count"
          if [ "$symlink_count" -gt 0 ]; then
            echo "FAIL: expected 0 symlinks in /usr/bin but found $symlink_count"
            exit 1
          fi
          echo "PASS: no symlinks remain in /usr/bin"
