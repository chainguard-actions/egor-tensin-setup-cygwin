name: Test Cygwin installation with packages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          install-dir: 'C:\tools\cygwin'
          packages: 'curl wget'

      - name: Assert Cygwin is installed and packages are available
        shell: pwsh
        run: |
          $path = $env:PATH
          Write-Host "PATH: $path"
          if ($path -notlike '*C:\tools\cygwin\bin*' -and $path -notlike '*C:/tools/cygwin/bin*') {
            Write-Host "FAIL: Cygwin bin directory not found in PATH"
            exit 1
          }
          Write-Host "PASS: Cygwin bin directory is on PATH"

      - name: Assert curl is available via Cygwin
        shell: bash
        run: |
          echo "Checking for curl..."
          if ! command -v curl >/dev/null 2>&1; then
            echo "FAIL: curl not found after package installation"
            exit 1
          fi
          echo "PASS: curl found at $(command -v curl)"

      - name: Assert wget is available via Cygwin
        shell: bash
        run: |
          echo "Checking for wget..."
          if ! command -v wget >/dev/null 2>&1; then
            echo "FAIL: wget not found after package installation"
            exit 1
          fi
          echo "PASS: wget found at $(command -v wget)"
