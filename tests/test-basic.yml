name: Test basic Cygwin installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-dir: C:\tools\cygwin
      - name: Assert Cygwin bin is on PATH
        shell: pwsh
        run: |
          $paths = $env:PATH -split ';'
          $found = $paths | Where-Object { $_ -like '*cygwin*bin*' }
          if (-not $found) {
            Write-Host "FAIL: Cygwin bin not found in PATH: $env:PATH"
            exit 1
          }
          Write-Host "PASS: Cygwin bin found in PATH: $found"
      - name: Assert bash is available
        shell: pwsh
        run: |
          $bash = Get-Command bash -ErrorAction SilentlyContinue
          if (-not $bash) {
            Write-Host "FAIL: bash not found in PATH"
            exit 1
          }
          Write-Host "PASS: bash found at $($bash.Path)"
      - name: Assert Cygwin install dir exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\tools\cygwin\bin\bash.exe')) {
            Write-Host "FAIL: bash.exe not found in install dir"
            exit 1
          }
          Write-Host "PASS: bash.exe found in C:\tools\cygwin\bin"
