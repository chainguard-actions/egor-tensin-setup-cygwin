name: Test basic Cygwin installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          platform: x64

      - name: Assert Cygwin bash is available
        shell: pwsh
        run: |
          $bash = "C:\tools\cygwin\bin\bash.exe"
          if (-not (Test-Path $bash)) {
            Write-Error "FAIL: Cygwin bash not found at $bash"
            exit 1
          }
          Write-Host "PASS: Cygwin bash found at $bash"

      - name: Assert Cygwin bin is on PATH
        shell: pwsh
        run: |
          $cygwinBin = "C:\tools\cygwin\bin"
          $pathEntries = $env:PATH -split ';'
          if ($pathEntries -notcontains $cygwinBin) {
            Write-Error "FAIL: $cygwinBin not found in PATH"
            exit 1
          }
          Write-Host "PASS: $cygwinBin is on PATH"

      - name: Assert Cygwin bash runs
        shell: cmd
        run: |
          bash --login -c "echo PASS: Cygwin bash works"
          if %ERRORLEVEL% neq 0 (
            echo FAIL: bash exited with error
            exit /b 1
          )
