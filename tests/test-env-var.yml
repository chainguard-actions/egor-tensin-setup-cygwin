name: Test Cygwin env variable setting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-dir: C:\tools\cygwin
          env: nodosfilewarning
      - name: Assert CYGWIN env var is set
        shell: pwsh
        run: |
          $val = $env:CYGWIN
          Write-Host "CYGWIN=$val"
          if ($val -ne 'nodosfilewarning') {
            Write-Host "FAIL: expected CYGWIN=nodosfilewarning but got '$val'"
            exit 1
          }
          Write-Host "PASS: CYGWIN env var is set correctly"
