name: Test Cygwin installation with packages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-dir: C:\tools\cygwin
          packages: curl wget
      - name: Assert curl is available via Cygwin
        shell: pwsh
        run: |
          $curlPath = 'C:\tools\cygwin\bin\curl.exe'
          if (-not (Test-Path $curlPath)) {
            Write-Host "FAIL: curl.exe not found at $curlPath"
            exit 1
          }
          Write-Host "PASS: curl.exe found at $curlPath"
      - name: Assert wget is available via Cygwin
        shell: pwsh
        run: |
          $wgetPath = 'C:\tools\cygwin\bin\wget.exe'
          if (-not (Test-Path $wgetPath)) {
            Write-Host "FAIL: wget.exe not found at $wgetPath"
            exit 1
          }
          Write-Host "PASS: wget.exe found at $wgetPath"
