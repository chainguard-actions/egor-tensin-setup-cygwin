name: Test non-Windows error
# This action only supports Windows. On Linux/macOS it should throw an error.
# act runs Linux containers, so this test verifies the expected failure behavior.
on:
  workflow_dispatch:

jobs:
  test-non-windows-error:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Attempt to install Cygwin on Linux (should fail)
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed on non-Windows
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on Linux, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on non-Windows runner"
