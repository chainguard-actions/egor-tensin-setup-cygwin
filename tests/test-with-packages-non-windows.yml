name: Test with packages on non-Windows host
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          packages: "git curl wget"
          install-dir: "C:\\tools\\cygwin"
          env: "nodosfilewarning"
          hardlinks: "0"
        continue-on-error: true
      - name: Assert action failed on non-Windows
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-Windows host, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected non-Windows host with packages specified"
